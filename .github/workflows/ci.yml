name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, test & build (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI smoke test (scan fixture, no API key)
        run: node dist/cli.js scan test/fixtures/php-app

      - name: CLI smoke test (scan --json emits valid JSON)
        shell: bash
        run: |
          node dist/cli.js scan test/fixtures/php-app --json 2>/dev/null > scan-smoke.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('scan-smoke.json', 'utf8'));
            if (r.stack !== 'php-jquery') throw new Error('unexpected stack: ' + r.stack);
            if (!Array.isArray(r.files) || r.files.length === 0) throw new Error('empty files array');
            if (typeof r.totalTokens !== 'number' || r.totalTokens <= 0) throw new Error('bad totalTokens');
            if (r.fitsInOneWindow !== true) throw new Error('fixture should fit one window');
            if (!r.excludedSensitive.includes('.env')) throw new Error('.env not reported as excluded');
            console.log('scan --json OK:', r.stack, r.fileCount + ' files,', r.totalTokens, 'tokens');
          "
          rm -f scan-smoke.json

      - name: CLI smoke (plan/convert --json contract without API key)
        shell: bash
        run: |
          node dist/cli.js plan test/fixtures/php-app --json > plan-out.json 2> plan-err.txt && rc=$? || rc=$?
          test "$rc" -eq 1 || { echo "expected exit 1 without API key, got $rc"; exit 1; }
          test ! -s plan-out.json || { echo "plan --json must not write stdout without a key"; exit 1; }
          grep -q "ANTHROPIC_API_KEY" plan-err.txt || { cat plan-err.txt; exit 1; }
          grep -q "OPENAI_API_KEY" plan-err.txt || { echo "multi-provider guidance missing OPENAI_API_KEY"; exit 1; }
          grep -q "GEMINI_API_KEY" plan-err.txt || { echo "multi-provider guidance missing GEMINI_API_KEY"; exit 1; }
          node dist/cli.js convert test/fixtures/php-app --json > conv-out.ndjson 2> conv-err.txt && rc=$? || rc=$?
          test "$rc" -eq 1 || { echo "expected exit 1 without API key, got $rc"; exit 1; }
          test ! -s conv-out.ndjson || { echo "convert --json must not write stdout without a key"; exit 1; }
          # explicit --provider with the matching key absent must also fail cleanly
          node dist/cli.js plan test/fixtures/php-app --provider openai > prov-out.txt 2> prov-err.txt && rc=$? || rc=$?
          test "$rc" -eq 1 || { echo "expected exit 1 for --provider openai without key, got $rc"; exit 1; }
          test ! -s prov-out.txt || { echo "provider-fail must not write stdout"; exit 1; }
          grep -q "OPENAI_API_KEY" prov-err.txt || { cat prov-err.txt; exit 1; }
          echo "plan/convert --json contract OK (keyed runs emit schema-versioned reports/events on stdout)"
          rm -f plan-out.json plan-err.txt conv-out.ndjson conv-err.txt prov-out.txt prov-err.txt

      - name: CLI smoke (--interactive contracts)
        shell: bash
        run: |
          # --interactive must never hang CI: with no TTY it warns on stderr and
          # falls back to the plain non-interactive flow (same no-key contract).
          node dist/cli.js convert test/fixtures/php-app --interactive > int-out.txt 2> int-err.txt && rc=$? || rc=$?
          test "$rc" -eq 1 || { echo "expected exit 1 without API key, got $rc"; exit 1; }
          test ! -s int-out.txt || { echo "--interactive must not write stdout without a key"; exit 1; }
          grep -q "not a TTY" int-err.txt || { cat int-err.txt; exit 1; }
          # --interactive + --json is a hard error (mutually exclusive).
          node dist/cli.js plan test/fixtures/php-app --interactive --json > int-json.txt 2> int-json-err.txt && rc=$? || rc=$?
          test "$rc" -eq 1 || { echo "expected exit 1 for --interactive --json, got $rc"; exit 1; }
          grep -q "mutually exclusive" int-json-err.txt || { cat int-json-err.txt; exit 1; }
          echo "--interactive contract OK (non-TTY fallback + --json mutual exclusion)"
          rm -f int-out.txt int-err.txt int-json.txt int-json-err.txt

      - name: MCP smoke (stdio JSON-RPC without API key)
        run: node test/mcp-smoke.mjs
